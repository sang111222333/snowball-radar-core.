[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowball-radar-core"
version = "0.1.0"
description = "A1 full crypto radar: scan a coin universe, score trend/momentum/volume/structure/derivatives and rank snowball setups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
snowball-radar = "snowball_radar.cli:main"

[tool.setuptools.packages.find]
include = ["snowball_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
